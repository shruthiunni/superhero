<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My superhero!</title>
    <style>
        body{
            background-color: rgb(212, 202, 126);
            color:whitesmoke;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .hero-name{

            font-size: 60px;
            font-weight: bold;
            color: rgb(56, 42, 3);
            text-shadow: 3px 3px rgb(255, 246, 117);
        }

        .tagline{
            font-style:italic;
            color: darkgoldenrod;
            text-transform: capitalize;
        }

        .label{
            text-transform:uppercase ;
            text-decoration:underline;
            color:rgb(59, 19, 5) ;
        }

        .power{
            font-weight: bold;
            color: darkred;
        }

        .weaknesses{
               text-decoration:line-through;
               color: maroon;

        }

        .badge{
          font-size: 28px;
          font-weight: bold;
          color: black;
          transform: rotate(15deg);


        }

        .made-by{
            color: darkred;
            font-style: italic;
        }
    </style>
</head>
<body>
    
    <h1 class="hero-name">Thunder kid⚡</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">Superpowers</h2>
    <p  class="power">Can run faster than a cheetah ✨</p>
    <p class="power"> Can lift a school bus 💪</p>

    <h2 class="label"> weaknesses</h2>
    <p class="weaknesses">Maths homework📃</p>
    <p class="weaknesses">Broccoli🥦</p>

    <p class="badge">Top hero </p>
    <p class="made-by">Created by ________</p>

</body>
</html>
